name: CI TaskFlow

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1 : Tests Python
  # ==========================================
  build-test:
    name: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Installer Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Executer les tests
        run: python -m pytest

  # ==========================================
  # JOB 2 : Analyse statique avec Semgrep
  # ==========================================
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Installer Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Installer Semgrep
        run: python -m pip install semgrep==1.186.0

      - name: Analyser le code avec Semgrep
        run: |
          semgrep scan \
            --config p/default \
            --config regles/ \
            --error \
            --exclude .venv \
            --exclude .git

  # ==========================================
  # JOB 3 : Detection de secrets avec Gitleaks
  # ==========================================
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code et l'historique Git
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Installer Gitleaks
        run: |
          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o gitleaks.tar.gz

          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Analyser les secrets
        run: gitleaks git --redact

  # ==========================================
  # JOB 4 : Analyse SCA et Docker avec Trivy
  # ==========================================
  trivy:
    name: trivy
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Installer la meme version de Trivy que celle du TP
      - name: Installer Trivy
        run: |
          curl -sSfL \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz \
            -o trivy.tar.gz

          tar -xzf trivy.tar.gz trivy
          sudo install trivy /usr/local/bin/trivy

          trivy --version

      # ======================================
      # ANALYSE DES DEPENDANCES
      # ======================================

      - name: Analyse informative des dependances
        run: |
          trivy fs \
            --scanners vuln \
            --exit-code 0 \
            .

      # Les vulnerabilites CRITICAL sont toujours bloquantes
      - name: Bloquer les dependances CRITICAL
        run: |
          trivy fs \
            --scanners vuln \
            --severity CRITICAL \
            --exit-code 1 \
            .

      # Les vulnerabilites HIGH sont bloquantes si corrigeables
      - name: Bloquer les dependances HIGH corrigeables
        run: |
          trivy fs \
            --scanners vuln \
            --severity HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            .

      # ======================================
      # CONSTRUCTION DE L'IMAGE DOCKER
      # ======================================

      - name: Construire l'image Docker
        run: docker build -t taskflow:tp3-ci .

      # ======================================
      # ANALYSE DE L'IMAGE DOCKER
      # ======================================

      - name: Analyse informative de l'image Docker
        run: |
          trivy image \
            --scanners vuln \
            --exit-code 0 \
            taskflow:tp3-ci

      # Les vulnerabilites CRITICAL sont toujours bloquantes
      - name: Bloquer les vulnerabilites CRITICAL de l'image
        run: |
          trivy image \
            --scanners vuln \
            --severity CRITICAL \
            --exit-code 1 \
            taskflow:tp3-ci

      # Les vulnerabilites HIGH sont bloquantes si corrigeables
      - name: Bloquer les vulnerabilites HIGH corrigeables de l'image
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            taskflow:tp3-ci

  # ==========================================
  # JOB 5 : Securite Infrastructure as Code
  # TP 4 - Checkov
  # ==========================================
  checkov-iac:
    name: checkov-iac
    runs-on: ubuntu-latest

    steps:

      # ======================================
      # RECUPERATION DU CODE
      # ======================================

      - name: Recuperer le code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # ======================================
      # INSTALLATION PYTHON
      # ======================================

      - name: Installer Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      # ======================================
      # INSTALLATION CHECKOV
      # ======================================

      - name: Installer Checkov
        run: |
          python -m pip install --upgrade pip
          python -m pip install checkov==3.4.9

          checkov --version

      # ======================================
      # INSTALLATION HELM
      # ======================================

      - name: Installer Helm 4.3.2
        run: |
          curl -fsSL \
            https://get.helm.sh/helm-v4.3.2-linux-amd64.tar.gz \
            -o helm.tar.gz

          echo "d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983  helm.tar.gz" | sha256sum -c -

          tar -xzf helm.tar.gz linux-amd64/helm

          sudo install linux-amd64/helm /usr/local/bin/helm

          helm version --short

      # ======================================
      # VALIDATION DU CHART HELM
      # ======================================

      - name: Verifier le chart Helm
        run: |
          helm lint ./charts/taskflow

          helm template taskflow ./charts/taskflow > /tmp/taskflow-rendered.yaml

          test -s /tmp/taskflow-rendered.yaml

      # ======================================
      # ANALYSE TERRAFORM
      # ======================================

      - name: Checkov - Analyser Terraform
        run: |
          checkov \
            -d infra/ \
            --framework terraform \
            --compact

      # ======================================
      # ANALYSE KUBERNETES
      # ======================================

      - name: Checkov - Analyser Kubernetes
        run: |
          checkov \
            -d k8s/ \
            --framework kubernetes \
            --compact

      # ======================================
      # ANALYSE HELM
      # ======================================

      - name: Checkov - Analyser Helm
        run: |
          checkov \
            -d ./charts/taskflow \
            --framework helm \
            --compact