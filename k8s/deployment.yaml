apiVersion: apps/v1
kind: Deployment

metadata:
  name: taskflow
  labels:
    app: taskflow

spec:
  replicas: 2

  selector:
    matchLabels:
      app: taskflow

  template:
    metadata:
      labels:
        app: taskflow

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: api
          image: nexa/taskflow:latest

          ports:
            - containerPort: 8085

          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

          env:
            - name: TASKFLOW_DB
              value: /data/taskflow.db

          volumeMounts:
            - name: data
              mountPath: /data

      volumes:
        - name: data
          hostPath:
            path: /var/taskflow
            type: DirectoryOrCreate