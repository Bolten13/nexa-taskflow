# ==========================================
# TASKFLOW - SERVICE KUBERNETES
# TP 4 - Infrastructure as Code
# ==========================================

apiVersion: v1
kind: Service

metadata:
  name: taskflow
  namespace: taskflow

  labels:
    app: taskflow

spec:
  type: ClusterIP

  selector:
    app: taskflow

  ports:
    - name: http
      port: 80
      targetPort: 8085
      protocol: TCP