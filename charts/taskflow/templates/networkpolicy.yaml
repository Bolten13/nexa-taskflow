# ==========================================
# TASKFLOW - NETWORK POLICY
# ==========================================

{{- if .Values.networkPolicy.enabled }}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: {{ .Release.Name }}-network-policy
  namespace: {{ .Values.namespace }}

spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-taskflow

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector: {}

      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}

{{- end }}